# Build DrumGen (instrument variant, vst/) into a DRAFT release (drumgen-vst-v<version>) with
# mpc-vst-plugins' shared workflow: Actions -> "VST release (draft)" -> Run workflow. dry_run (default on)
# builds the zip and skin previews as run artifacts only. tools_ref pinned to the same mpc-vst-plugins
# commit as mpc-vst-euclidier.
name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.0
        required: true
        default: 1.0.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  drumgen:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@259f75d0ce0f836cfd89cc0a33c550b55917cffc
    permissions:
      contents: write
    with:
      tag: drumgen-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 259f75d0ce0f836cfd89cc0a33c550b55917cffc
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: drumgen
      license: MIT
      about: 8-lane probability drum generator after the NGEN DRUMGEN (NGEN templates from the SD card + Groove Bank grooves) - drives drum tracks over MIDI.
      dry_run: ${{ inputs.dry_run }}
